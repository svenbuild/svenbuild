<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="Software that works without an account at another service.">
  <defs><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7484F4" stop-opacity="0"/><stop offset=".5" stop-color="#b08cff"/><stop offset="1" stop-color="#3fd0dc" stop-opacity="0"/></linearGradient></defs>
  <style>
    .f { font: 500 19px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #8b91ad; }
    .d { animation: run 7s linear infinite; }
    @keyframes run { from { transform: translateX(-200px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .d { animation: none; } }
  </style>
  <rect x="0" y="20" width="1200" height="1.5" fill="url(#l)"/>
  <rect x="0" y="18.5" width="200" height="4" rx="2" fill="url(#l)" class="d"/>
  <text x="600" y="64" text-anchor="middle" class="f">Software that works without an account at another service.</text>
</svg>
