<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 264" width="590" height="264" role="img" aria-label="Diffly">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f9bff"/><stop offset="1" stop-color="#3fd0dc"/></linearGradient>
    <radialGradient id="hd"><stop offset="0" stop-color="#2f9bff" stop-opacity=".5"/><stop offset="1" stop-color="#2f9bff" stop-opacity="0"/></radialGradient>
    <clipPath id="cd"><rect width="590" height="264" rx="20"/></clipPath>
    <linearGradient id="sd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .t { font: 750 31px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #f4f5fb; letter-spacing: -.8px; }
    .d { font: 400 17.5px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #a9afc6; }
    .p { font: 500 13px ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace; fill: #c9cee6; }
    .sw { animation: sweep 5.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-260px); } 60%, 100% { transform: translateX(640px); } }
    .fl { animation: float 6s ease-in-out infinite; transform-origin: 520px 62px; }
    @keyframes float { 50% { transform: translateY(-5px) rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { .sw, .fl { animation: none; } }
  </style>
  <g clip-path="url(#cd)">
    <rect width="590" height="264" fill="#0c0d15"/>
    <circle cx="520" cy="40" r="210" fill="url(#hd)"><animate attributeName="r" values="190;230;190" dur="8s" repeatCount="indefinite"/></circle>
    <rect x="0" y="0" width="220" height="2" fill="url(#sd)" class="sw"/>
    <g class="fl"><rect x="490" y="32" width="60" height="60" rx="16" fill="url(#bd)"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(504 46) scale(1.33)"><path d="M6 4v16M18 4v16M10 8h4M10 12h4M10 16h4"/></g></g>
    <text x="34" y="72" class="t">Diffly</text>
    <text x="34" y="118" class="d">A local desktop diff tool for files and</text><text x="34" y="145" class="d">folders. Windows, macOS and Linux.</text><rect x="34" y="204" width="104" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="86" y="223" text-anchor="middle" class="p">typescript</text><rect x="147" y="204" width="71" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="183" y="223" text-anchor="middle" class="p">svelte</text><rect x="227" y="204" width="88" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="271" y="223" text-anchor="middle" class="p">electron</text>
  </g>
  <rect x=".5" y=".5" width="589" height="263" rx="20" fill="none" stroke="url(#bd)" stroke-opacity=".55"/>
</svg>
