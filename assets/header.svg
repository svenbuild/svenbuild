<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 318" width="1200" height="318" role="img" aria-label="Sven. Software for the machines you own.">
  <style>
    .path { font: 15px 'Cascadia Mono', ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace; fill: #86868d; }
    .path tspan { fill: #e9e9ec; }
    .h { font: 700 78px 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #e9e9ec; letter-spacing: -3.2px; }
    .s { font: 400 21px 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #b9b9c0; }
    .cur { fill: #7484F4; animation: blink 1.1s steps(2, jump-none) infinite; }
