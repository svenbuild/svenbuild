<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 264" width="590" height="264" role="img" aria-label="Fylvo">
  <defs>
    <linearGradient id="bf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7484F4"/><stop offset="1" stop-color="#b08cff"/></linearGradient>
    <radialGradient id="hf"><stop offset="0" stop-color="#7484F4" stop-opacity=".5"/><stop offset="1" stop-color="#7484F4" stop-opacity="0"/></radialGradient>
    <clipPath id="cf"><rect width="590" height="264" rx="20"/></clipPath>
    <linearGradient id="sf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .t { font: 750 31px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #f4f5fb; letter-spacing: -.8px; }
    .d { font: 400 17.5px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #a9afc6; }
    .p { font: 500 13px ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace; fill: #c9cee6; }
    .sw { animation: sweep 5.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-260px); } 60%, 100% { transform: translateX(640px); } }
    .fl { animation: float 6s ease-in-out infinite; transform-origin: 520px 62px; }
    @keyframes float { 50% { transform: translateY(-5px) rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { .sw, .fl { animation: none; } }
  </style>
  <g clip-path="url(#cf)">
    <rect width="590" height="264" fill="#0c0d15"/>
    <circle cx="520" cy="40" r="210" fill="url(#hf)"><animate attributeName="r" values="190;230;190" dur="8s" repeatCount="indefinite"/></circle>
    <rect x="0" y="0" width="220" height="2" fill="url(#sf)" class="sw"/>
    <g class="fl"><rect x="490" y="32" width="60" height="60" rx="16" fill="url(#bf)"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(504 46) scale(1.33)"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 10.5a3.8 3.8 0 0 1-.5 7.5z"/></g></g>
    <text x="34" y="72" class="t">Fylvo</text>
    <text x="34" y="118" class="d">A lean, private cloud for your own server.</text><text x="34" y="145" class="d">Files, sharing, office and sync apps</text><text x="34" y="172" class="d">in one container.</text><rect x="34" y="204" width="38" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="53" y="223" text-anchor="middle" class="p">go</text><rect x="81" y="204" width="63" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="113" y="223" text-anchor="middle" class="p">react</text><rect x="153" y="204" width="71" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="189" y="223" text-anchor="middle" class="p">kotlin</text><rect x="234" y="204" width="55" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="261" y="223" text-anchor="middle" class="p">rust</text>
  </g>
  <rect x=".5" y=".5" width="589" height="263" rx="20" fill="none" stroke="url(#bf)" stroke-opacity=".55"/>
</svg>
