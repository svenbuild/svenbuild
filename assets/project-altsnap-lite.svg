<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 236" width="1200" height="236" role="img" aria-label="AltSnap Lite">
  <style>
    .n { font: 700 34px 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #e9e9ec; letter-spacing: -1px; }
    .r { font: 14px 'Cascadia Mono', ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace; fill: #86868d; }
    .d { font: 400 20px 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #c4c4ca; }
    .l { font: 14.5px 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #86868d; }
  </style>
  <defs><clipPath id="md"><rect x="30" y="176" width="1140" height="6" rx="3"><animate attributeName="width" values="0;1140" keyTimes="0;1" calcMode="spline" keySplines=".2 .7 .2 1" begin=".3s" dur="1.6s" fill="freeze"/><set attributeName="width" to="0" begin="0s" end=".3s"/></rect></clipPath></defs>
  <rect x=".5" y=".5" width="1199" height="235" rx="10" fill="#0a0a0a" stroke="#232326"/>
  <g transform="translate(28 34) scale(1.5)"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="#7484F4" stroke-width="1.5" stroke-linejoin="round"/></g>
  <text x="76" y="68" class="n">AltSnap Lite</text>
  <text x="30" y="104" class="r">github.com/svenbuild/altsnap-lite</text>
  <text x="330" y="66" class="d">Move, resize, snap and pin any window with Alt + mouse.</text><text x="330" y="96" class="d">A tiny tray app for Windows 10 and 11.</text>
  <rect x="30" y="176" width="1140" height="6" rx="3" fill="#1e1e22"/>
  <g clip-path="url(#md)"><rect x="30.0" y="176" width="1129.2" height="6" fill="#178600"/><rect x="1161.2" y="176" width="6.8" height="6" fill="#5391FE"/></g>
  <g><circle cx="35" cy="206" r="4.5" fill="#178600"/><text x="46" y="211" class="l">C# 99 %</text><circle cx="131" cy="206" r="4.5" fill="#5391FE"/><text x="142" y="211" class="l">PowerShell 1 %</text><animate attributeName="opacity" values="0;0;1" keyTimes="0;.75;1" dur="2.2s" fill="freeze"/></g>
</svg>
